name: Time Check
run-name: "시간 확인 - ${{github.actor}}"
on:
  workflow_dispatch

jobs:
  show-time:
    runs-on: ubuntu-latest
    steps:
      - name: 시간 정보
        run: echo "=== 시간 정보 ==="
        
      - name: 현재 UTC 시간
        run: echo "$(date -u)"

      - name: 현재 KST 시간
        run: echo "$(TZ='Asia/Seoul' date)"

      - name: 시간 정보 종합
        run: echo "$(date +%s)" 

      - name: fin
        run: echo "=== 끝 ==="
